<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160"><title>Arquitetura da solução VitalPet Tech</title><desc>Clean Architecture com API, Application, Domain, Infrastructure, Oracle e MongoDB. Setas indicam dependências, composição e acesso aos bancos.</desc><rect width="1800" height="1160" fill="#F5F7FB"/>
